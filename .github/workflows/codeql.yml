name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Segunda-feira de manha (UTC) - varredura independente de push, pega
    # avisos novos de CVE em dependencias/padroes que o CodeQL passou a
    # reconhecer desde o ultimo scan.
    - cron: "0 7 * * 1"

jobs:
  analyze:
    name: Analise estatica (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
