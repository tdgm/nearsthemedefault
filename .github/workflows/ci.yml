name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege por padrao (docs/adr/0008). Nenhum job deste workflow
# precisa escrever no repo ou em PRs; dependency-review eleva pull-requests
# para leitura, nada mais.
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  validate:
    name: Lint, tipos e manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high   # vulnerabilidade high/critical bloqueia merge
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm manifests:validate   # Zod sobre os 4 YAML de /nears
      - run: pnpm tokens:contrast      # falha se algum par nao atingir AA

  test:
    name: Unit e acessibilidade
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --coverage
      - run: pnpm build-storybook --quiet
      - run: pnpm test:a11y            # axe em 100% das stories, 0 violacoes

  budgets:
    name: Orcamento de bundle
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/check-budgets.mjs

  lighthouse:
    name: Core Web Vitals
    runs-on: ubuntu-latest
    needs: budgets
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm start &
      - run: npx wait-on http://localhost:3000 -t 60000
      - run: npx @lhci/cli autorun
      - run: node scripts/check-third-party-hosts.mjs   # hosts distintos; LHCI nao tem assercao nativa para isso

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: budgets
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:nojs    # valida conteudo indexavel sem JavaScript

  secrets-scan:
    name: Segredos no codigo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks varre o historico inteiro, nao so o HEAD
      - uses: gitleaks/gitleaks-action@v2

  dependency-review:
    name: Revisao de dependencias (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      # Repo privado: este Action exige GitHub Advanced Security habilitado
      # na org/repo. Sem GHAS o job falha por falta de permissao da
      # plataforma, nao por vulnerabilidade real - confirme antes de tratar
      # isso como gate obrigatorio (docs/adr/0008).
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
