name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege por padrao (docs/adr/0008). Nenhum job deste workflow
# precisa escrever no repo ou em PRs; dependency-review eleva pull-requests
# para leitura, nada mais.
permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: Lint, tipos e manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5   # versao vem de packageManager no package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high   # vulnerabilidade high/critical bloqueia merge
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm manifests:validate   # Zod sobre os 4 YAML de /nears
      - run: pnpm tokens:contrast      # falha se algum par nao atingir AA

  test:
    name: Unit e acessibilidade
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5   # versao vem de packageManager no package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm test --coverage` falha no pnpm 9 ("Unknown option: 'coverage'") e
      # `pnpm test -- --coverage` repassa o "--" ao vitest, que acha 0 testes.
      # Chamar o vitest direto evita os dois (docs/adr/0009).
      - run: pnpm exec vitest run --coverage
      - run: pnpm build-storybook --quiet
      - run: pnpm exec playwright install --with-deps chromium   # test-runner do Storybook usa Playwright
      - run: pnpm test:a11y            # axe em 100% das stories, 0 violacoes

  budgets:
    name: Orcamento de bundle
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5   # versao vem de packageManager no package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/check-budgets.mjs
      - run: node scripts/check-ui-bundle.mjs   # @nears/ui <= 25 KB gzip (Fase 3)

  lighthouse:
    name: Core Web Vitals
    runs-on: ubuntu-latest
    needs: budgets
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5   # versao vem de packageManager no package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # O proprio LHCI sobe e derruba o servidor (collect.startServerCommand em
      # lighthouserc.json): sem `&` solto e sem dependencia extra tipo wait-on.
      # Retry de 1x (ADR 0030): runner compartilhado do GH Actions tem variancia de
      # CPU grande o bastante pra fazer `pnpm lh` falhar sozinho (confirmado: um
      # commit so de docs, sem nenhuma mudanca de codigo, ja falhou este job).
      # Sem acao externa nova de terceiro: so um loop de shell, sem custo de KB
      # na rota critica (roda so no CI, nunca no bundle do site).
      - name: pnpm lh (ate 2 tentativas - ruido conhecido do runner, ADR 0030)
        run: |
          for attempt in 1 2; do
            if pnpm lh; then
              exit 0
            fi
            echo "pnpm lh falhou (tentativa $attempt/2)"
          done
          exit 1
      # Relatorios completos (trace, LCP element, rede) para diagnosticar falhas de CWV:
      # o upload do LHCI vai para um storage publico temporario, fora do alcance do repo.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
      - run: node scripts/check-third-party-hosts.mjs   # hosts distintos; LHCI nao tem assercao nativa para isso

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: budgets
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5   # versao vem de packageManager no package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:nojs    # valida conteudo indexavel sem JavaScript
      - run: pnpm test:e2e:presets   # fluxo de compra em cada preset de nicho (um build por preset; ADR 0024)

  secrets-scan:
    name: Segredos no codigo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lista os commits do PR pela API
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks varre o historico inteiro, nao so o HEAD
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Revisao de dependencias (PR)
    runs-on: ubuntu-latest
    # Nao roda em repo privado sem GHAS: o Action falha por limite da plataforma
    # ("Dependency review is not supported on this repository"), nao por
    # vulnerabilidade. O gate de dependencias nesse caso e o `pnpm audit
    # --audit-level=high` do job validate (docs/adr/0008, 0009).
    if: github.event_name == 'pull_request' && !github.event.repository.private
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      # Repo privado: este Action exige GitHub Advanced Security habilitado
      # na org/repo. Sem GHAS o job falha por falta de permissao da
      # plataforma, nao por vulnerabilidade real - confirme antes de tratar
      # isso como gate obrigatorio (docs/adr/0008).
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
