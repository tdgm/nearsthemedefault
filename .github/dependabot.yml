version: 2

updates:
  # pnpm workspace na raiz. Dependabot detecta pnpm-lock.yaml automaticamente
  # e atualiza as dependencias de todo o monorepo (apps/web, packages/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
    # Majors do toolchain so entram por decisao explicita, uma por vez, com ADR
    # (docs/adr/0035). Patches e minors seguem automaticos.
    ignore:
      - dependency-name: storybook
        update-types: ["version-update:semver-major"]
      - dependency-name: "@storybook/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Mantem as Actions do .github/workflows atualizadas - e o mecanismo que
  # substitui pin manual de SHA (ver docs/adr/0008, item sobre nao fabricar
  # hash de commit a mao).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
