# Catalogo de blocos. O build falha se uma section nao declarar
# priority, cwv e a11y. Props sao validadas por Zod gerado deste arquivo.
version: 1.0.0

priorityLevels:
  critical: "no HTML inicial, sem lazy"
  high: "no HTML inicial, hidratacao diferida"
  lazy: "fora da dobra, content-visibility auto"
  on-interaction: "JS so entra ao interagir"
  idle: "requestIdleCallback"
  inherit: >
    Nao e um nivel proprio: resolve em build time para a priority da section
    que instancia este bloco (ver `nestedOnlyIn` na definicao da section).
    Ex.: product-card dentro de product-grid (critical) => critical; dentro
    de showcase, pdp-bundle ou pdp-related (lazy) => lazy. Uma section com
    `priority: inherit` so pode aparecer dentro de um container listado em
    `nestedOnlyIn`; usa-la direto na lista `sections` de um template falha o
    build (nao ha mae de quem herdar).

globals:
  - id: promo-bar
    slot: above-header
    priority: critical
    props:
      message: { type: string, required: true }
      href: { type: url }
      countdown: { type: object, props: { endsAt: datetime } }
      dismissible: { type: boolean, default: true }
      rulesHref: { type: url }
      labels: { type: object, note: "microcopy" }
    cwv: { reservedHeight: 48, cls: 0, ssrTime: true }
    a11y: { role: region, labelRequired: true, dismissKeyboard: true }

  - id: header
    slot: header
    priority: critical
    variants: [full, minimal, none]
    variantRules: []   # ex.: [{ pattern: "*/p", variant: minimal }]; o layout raiz usa `full` em todas as rotas (docs/adr/0025)
    props:
      logo: { type: image, required: true }
      homeHref: { type: url, default: "/" }
      nav: { type: ref, to: navigation }
      search: { type: boolean, default: true }
      searchHref: { type: url, default: "/s" }
      account: { type: boolean, default: true }
      accountHref: { type: url, default: "/account" }
      wishlist: { type: boolean, default: true }
      wishlistHref: { type: url, default: "/account/favoritos" }
      cart: { type: boolean, default: true }
      cartCount: { type: number, default: 0 }
      wishlistCount: { type: number, default: 0 }
      variant: { type: enum, values: [full, minimal, none], default: full }
      skipLink: { type: boolean, default: true }   # false quando o layout renderiza <SkipLink> antes da PromoBar (docs/adr/0026)
      labels: { type: object, note: "microcopy (vem de vocabulary no app)" }
    cwv: { reservedHeight: 56, sticky: true }
    a11y: { landmark: banner, skipLink: required }

  - id: nav-drawer
    slot: overlay
    priority: on-interaction
    props:
      departments:
        type: array
        of:
          label: string
          href: url
          groups: array
          highlight: { type: object }
          promo: { type: object }
      labels: { type: object, note: "microcopy" }
    cwv: { linksInInitialHtml: true, jsOnInteraction: true }
    a11y:
      focusTrap: true
      escClose: true
      ariaExpanded: true
      landmark: navigation

  - id: minicart
    slot: overlay
    priority: on-interaction
    props:
      items: array
      cartHref: { type: url, default: "/carrinho" }
      checkoutHref: { type: url, default: "/checkout" }
      continueHref: { type: url, default: "/" }
      freeShippingFrom: money
      labels: { type: object, note: "microcopy" }
    cwv: { noBlockingFetchOnLoad: true }
    a11y: { focusTrap: true, escClose: true, liveRegion: true }

  - id: footer
    slot: footer
    priority: lazy
    props:
      service: array
      newsletter:
        type: object
        props:
          title: string
          description: string
          action: url
          segments: array
      columns: array
      apps: array
      social: array
      seals: array
      legal: object
      labels: { type: object, note: "microcopy" }
    cwv: { contentVisibility: auto, containIntrinsicSize: "0 640px" }
    a11y: { landmark: contentinfo, collapsibleAria: true }

  - id: customer-service
    slot: floating
    priority: idle
    props:
      channels: array
      labels: { type: object, note: "microcopy" }
    cwv: { reservedHeight: 0, noLayoutShift: true }
    a11y: { minTouchTarget: 44 }

sections:
  - id: hero
    priority: critical
    props:
      slides:
        type: array
        min: 1
        of:
          imageDesktop: image
          imageMobile: image
          alt: { type: string, required: true }
          href: url
          headline: string
          cta: string
      autoplay: { type: boolean, default: false }
      intervalMs: { type: number, min: 3000, default: 6000 }
      labels: { type: object }
    cwv:
      lcpCandidate: true
      firstSlide: { loading: eager, fetchpriority: high }
      media: picture
      formats: [avif, webp]
      aspectRatio: required
    # Carrossel basico do APG (regiao + anterior/proximo); pausa obrigatoria quando autoplay=true.
    a11y: { carousel: apg-basic, pauseControl: required-with-autoplay, keyboardNav: true }

  - id: benefit-bar
    priority: high
    props:
      items: { type: array, min: 1, of: { icon: string, label: string, href: url } }
      label: string
    cwv: { reservedHeight: 44 }
    a11y: { role: list }

  - id: section-title
    # So titulo + link opcional, sem midia: custo fixo e desprezivel em
    # qualquer posicao. Prioridade propria (nao herda) para poder ser usada
    # direto na lista de um template, inclusive dentro de `repeat`.
    priority: high
    props:
      text: { type: string, required: true }
      level: { type: enum, values: [h1, h2, h3], default: h2 }
      href: url
    cwv: { noLayoutShift: true }
    a11y: { headingOrder: enforced }

  - id: banner-grid
    priority: lazy
    props:
      columns: { type: enum, values: ["2", "3", "4"], default: "3" }
      banners: { type: array }
    cwv: { media: picture, loading: lazy, aspectRatio: required }
    a11y: { role: list, altRequired: true }

  - id: category-hub
    priority: lazy
    props:
      # `items` sao as categorias ja resolvidas pelo template (ex.: do departamento);
      # `limit` corta a lista (docs/adr/0015).
      items: { type: array, min: 1, of: { image: image, label: string, fromPrice: money, href: url } }
      limit: { type: number, default: 6 }
      labels: { type: object }
    cwv: { aspectRatio: required, scrollSnap: native }
    a11y: { role: list, keyboardScroll: true }
    seo: { renderAs: ul, linksInHtml: true }

  - id: showcase
    priority: lazy
    variants: [static, tabs, personalized, wishlist, recommended]
    props:
      title: string
      source: { type: enum, values: [collection, query, recommender] }
      limit: { type: number, min: 4, max: 12, default: 8 }
      tabs: array
      variant: { type: enum, values: [static, tabs, personalized, wishlist, recommended], default: static }
      products: array
      labels: { type: object }
    cwv: { ssrFirstTab: true, scrollSnap: native, contentVisibility: auto, containIntrinsicSize: "0 520px" }
    a11y: { tabs: tablist, keyboardNav: true, region: true }
    seo: { schema: ItemList }

  - id: event-banner
    priority: lazy
    props: { imageDesktop: image, imageMobile: image, alt: string, href: url }
    cwv: { media: picture, aspectRatio: required }
    a11y: { altRequired: true }

  - id: banner-full
    priority: lazy
    props:
      image: image
      alt: string
      headline: string
      body: string
      cta: string
      href: url
      imageSide: { type: enum, values: [left, right], default: left }
    cwv: { media: picture, aspectRatio: required }
    a11y: { contrastOverImage: verified, textOverImage: false }

  - id: quick-filter
    priority: high
    props:
      chips: { type: array, min: 1, of: { label: string, facet: string, value: string } }
      basePath: string
      current: { type: object }
      labels: { type: object }
    cwv: { reservedHeight: 48, scrollSnap: native }
    a11y: { role: list, minTouchTarget: 44 }
    seo: { linksInHtml: true, relNofollowWhenMultiFacet: true }

  - id: product-grid
    priority: critical
    props:
      columns: { xs: 2, md: 3, lg: 4 }
      pageSize: { type: number, default: 24 }
      sort:
        type: array
        default: [relevance, price_asc, price_desc, newest, discount]
      facets:
        type: array
        from: catalog.facets.available   # definido por nicho
      products: array
      total: number
      page: number
      basePath: string
      query: { type: object }
      currentSort: string
      filters: array
      labels: { type: object }
    cwv:
      ssr: true
      skeleton: true
      imageSizes: required
      noLayoutShift: true
      containIntrinsicSize: required
    a11y:
      role: list
      resultsLiveRegion: true
      filtersInDrawer: focusTrap
    seo:
      schema: ItemList
      pagination: { urls: indexable, rel: [prev, next] }

  - id: product-card
    priority: inherit
    nestedOnlyIn: [product-grid, showcase, pdp-bundle, pdp-related]
    props:
      image: { type: image, required: true }
      hoverImage: image
      name: { type: string, required: true }
      href: { type: string, required: true }
      price: { type: money, required: true }
      listPrice: money
      installments: object
      badges: array
      variantPreview:
        type: array
        note: "amostras do primeiro eixo de catalog.variantAxes; vazio se o nicho nao tem variacao"
      quickAdd: { type: boolean, default: false }
      quickAddAction: string
      wishlist: { type: boolean, default: true }
      wishlistAction: string
      aspect: { type: enum, values: [product, portrait, landscape, square], default: portrait }
      # Resolvido pelo container (docs/adr/0006): acima da dobra = eager + fetchpriority alto.
      priority: { type: boolean, default: false }
      sizes: string
      labels: { type: object }
    cwv:
      aspectRatio: "{media.aspect[catalog.productMedia.aspect]}"
      intrinsicSize: required
      lazy: belowFold
      sizes: "{media.sizes.productCard}"
    a11y:
      wholeCardLink: false      # acoes sao controles separados
      actionsSeparate: true
      minTouchTarget: 44
      altFromProductName: true

  - id: breadcrumb
    priority: critical
    props: { items: array, label: string }
    cwv: { reservedHeight: 32 }
    a11y: { landmark: navigation, label: "Voce esta em" }
    seo: { schema: BreadcrumbList }

  - id: text-seo
    priority: lazy
    props:
      title: string
      richText: { type: richtext, required: true }
      collapsible: { type: boolean, default: true }
      collapsedHeight: { type: number, default: 160 }
      labels: { type: object }
    cwv: { contentVisibility: auto, containIntrinsicSize: "0 320px" }
    a11y: { expandControl: native-details, contentAlwaysInDom: true }
    geo: { chunkable: true, answerFirst: true, headingAsQuestion: preferred }

  - id: faq
    priority: lazy
    props:
      title: string
      items:
        type: array
        min: 3
        of: { question: string, answer: richtext }
    cwv: { contentVisibility: auto }
    a11y: { accordion: true, keyboardNav: true, contentInDom: true }
    seo: { schema: FAQPage }
    geo: { required: true }

  - id: related-links
    priority: lazy
    props:
      title: string
      links: { type: array, of: { label: string, href: url } }
    cwv: { contentVisibility: auto }
    a11y: { role: list }
    seo: { internalLinking: true, descriptiveAnchors: enforced }

pdpSections:
  - id: pdp-gallery
    priority: critical
    props:
      images: array
      zoom: { type: boolean, default: true }
      video: url
      thumbs: { type: enum, values: [vertical, dots] }
      aspect: { type: enum, values: [product, portrait, landscape, square], default: portrait }
      labels: object
    cwv:
      lcpCandidate: true
      firstImage: { fetchpriority: high }
      aspectRatio: "{media.aspect[catalog.productMedia.aspect]}"
    a11y: { keyboardNav: true, zoomEscClose: true }

  - id: pdp-buybox
    priority: critical
    props:
      name: string
      rating: object
      price: money
      listPrice: money
      installments: object
      availability: { type: enum, values: [in_stock, out_of_stock, preorder], default: in_stock }
      sku: string
      addToCartAction:
        type: url
        note: "endpoint POST do adicionar; sem ele o CTA fica desabilitado"
      labels: object
      variantSelectors:
        type: array
        from: catalog.variantAxes      # um seletor por eixo; zero se nao ha variacao
      guideHref:
        type: url
        enabledBy: catalog.guide.enabled
      cta: string                      # default: vocabulary.addToCart
      stickyMobile: { type: boolean, default: true }
    cwv: { noLayoutShift: true, stickyReservedHeight: 72 }
    a11y:
      variantSelector: radiogroup      # swatch e option, sempre radiogroup
      liveRegion: addToCart
      minTouchTarget: 44

  - id: pdp-shipping
    priority: high
    props:
      zipInput: { type: boolean, default: true }
      helpHref: url
      cep: { type: string, note: "CEP informado (?cep=), ja validado" }
      quote: { type: object, note: "opcoes de entrega ou erro; vem do data layer" }
      labels: object
    cwv: { reservedHeight: 96 }
    a11y: { inputLabel: required, errorAssociation: ariaDescribedby }

  # Retirada/entrega pela loja mais proxima (Fase 9d, ADR 0028). ADITIVO sobre
  # pdp-shipping, nunca substituicao: so renderiza quando fulfillment.mode !=
  # "centralized" (apps/web/lib/templates/pdp-content.ts). Reusa o MESMO
  # ?cep= de pdp-shipping - nunca pede o CEP de novo.
  - id: pdp-pickup
    priority: high
    props:
      cep: { type: string, note: "CEP informado (?cep=), ja validado - mesmo de pdp-shipping" }
      quote: { type: object, note: "loja mais proxima com retirada/entrega, ou erro; vem do data layer" }
      labels: object
    cwv: { reservedHeight: 64 }
    a11y: { liveRegion: status, noJsRequired: true }

  - id: pdp-details
    priority: lazy
    props:
      description: richtext
      specs:
        type: table
        enabledBy: catalog.specTable.enabled
        note: "pares atributo/valor; vira additionalProperty no JSON-LD"
      instructions:
        type: richtext
        note: "cuidados, uso, instalacao, conservacao - conforme o nicho"
      guide:
        type: table
        enabledBy: catalog.guide.enabled
        note: "medidas, compatibilidade, voltagem, tabela nutricional..."
      labels: object
    cwv: { contentVisibility: auto }
    a11y: { accordion: true, tableHeaders: scope }
    geo: { renderAsTable: true, neverAsImage: true }

  - id: pdp-reviews
    priority: lazy
    props:
      provider: string
      aggregate: { rating: number, count: number }
      items: array
      labels: object
    cwv: { ssrAggregate: true }
    a11y: { ratingTextAlternative: required }
    seo: { schema: [AggregateRating, Review] }

  - id: pdp-bundle
    priority: lazy
    props:
      title: { type: string, default: vocabulary.bundle }
      products: array
    note: "produtos complementares: compre junto, kit, complete o look..."
    cwv: { scrollSnap: native }
    a11y: { role: list }
    seo: { schema: ItemList }

  - id: pdp-related
    priority: lazy
    props:
      title: { type: string, default: "Você também pode gostar" }
      products: array
    cwv: { scrollSnap: native }
    a11y: { role: list }
    seo: { schema: ItemList }

templates:
  home:
    sections:
      - hero
      - benefit-bar
      - repeat:
          over: departments
          limit: { from: composition.home.featuredDepartments }
          blocks: [section-title, banner-grid, category-hub]
      - event-banner
      - showcase:tabs
      - showcase:wishlist
      - event-banner
      - section-title
      - banner-grid
      - banner-full
      - text-seo
      - faq
      - related-links

  collection:
    sections: [breadcrumb, section-title, event-banner, quick-filter,
               product-grid, text-seo, faq, related-links]

  pdp:
    sections: [breadcrumb, pdp-gallery, pdp-buybox, pdp-shipping, pdp-pickup, pdp-details,
               pdp-reviews, pdp-bundle, pdp-related, faq]

  landing:
    sections: [hero, banner-grid, showcase, banner-full, text-seo, related-links]

  page:
    sections: [event-banner, banner-full, text-seo, related-links]

  search:
    sections: [breadcrumb, section-title, product-grid]

  sitemap:
    sections:
      - section-title
      - repeat: { over: departments, blocks: [related-links] }
      # Tipos de produto, campanhas e paginas institucionais: sem este bloco
      # nada alem do rodape linkaria para eles (zero links orfaos).
      - related-links

  notfound:
    sections: [section-title, showcase:recommended]

  # Login/cadastro (Fase 9b, ADR 0027): paginas utilitarias, fora do fluxo de
  # merchandising - mesma liberdade que o template `search` ja toma (o
  # formulario de fato e um componente simples em apps/web/components/, nao
  # uma section nova; o template so referencia o que ja existe para passar na
  # checagem cruzada de refs.ts > checkTemplates/checkRoutes).
  login:
    sections: [section-title]

  cadastro:
    sections: [section-title]

  # Area da conta (Fase 9c, ADR 0027): mesma liberdade de login/cadastro - cada
  # pagina e so um shell + ilha Suspense em apps/web/app/account/**, nenhuma
  # section nova. So referenciam section-title para satisfazer
  # refs.ts > checkTemplates/checkRoutes.
  account:
    sections: [section-title]

  account-dados:
    sections: [section-title]

  account-enderecos:
    sections: [section-title]

  account-pedidos:
    sections: [section-title]

  account-pedido-detalhe:
    sections: [section-title]

  account-favoritos:
    sections: [section-title]

  # Fulfillment por loja (Fase 9d, ADR 0028): pagina institucional publica,
  # mesma liberdade de login/cadastro/account - a lista de lojas e so um
  # componente simples em apps/web/app/lojas/page.tsx, nenhuma section nova.
  lojas:
    sections: [section-title]

validation:
  everySectionMustDeclare: [priority, cwv, a11y]
  onMissing: fail-build
  # Tipos DISTINTOS de section usados num template (superficie de
  # composicao/numero de chunks JS possiveis), contado uma vez por tipo
  # independente de quantas vezes um `repeat` o instancia.
  maxSectionsPerPage: 24
  # Instancias RENDERIZADAS apos expandir todo `repeat` (o numero real de
  # blocos na pagina). Cada instancia reusa o mesmo chunk JS do seu tipo, mas
  # ainda pesa HTML/DOM - por isso o teto e mais generoso, nao ausente.
  maxSectionInstancesPerPage: 40
  # Instancias com priority critical (sem lazy, podem ser candidatas a LCP).
  maxCriticalSections: 4
