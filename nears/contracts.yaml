# Contratos de dados, SEO e GEO. Os helpers de JSON-LD sao gerados daqui.
version: 1.0.0

data:
  product:
    required:
      - id
      - sku
      - gtin
      - name
      - slug
      - brand
      - description
      - images          # minimo 4, cada uma com url, alt, width, height
      - breadcrumb
      - offers
    offers:
      required:
        - price
        - listPrice
        - priceCurrency      # BRL
        - availability       # InStock | OutOfStock | PreOrder
        - itemCondition      # NewCondition
        - priceValidUntil
        - seller
        - installments       # { count, value, interestFree }
    requiredForGeo:
      - aggregateRating          # { ratingValue, reviewCount }
      - shippingDetails          # { deliveryTime, shippingRate, destination }
      - hasMerchantReturnPolicy  # { returnDays, returnMethod, returnFees }
      - additionalProperty       # specs da PDP como PropertyValue[] (catalog.specTable)
    requiredForGeoFrom: catalog.geoAttributes   # extras do nicho (ex.: color, material)
    variants:
      # So existe quando catalog.variantAxes nao esta vazio.
      isVariantOf: { groupId: string, name: string }
      variesBy: catalog.variantAxes[].schemaOrg
      hasVariant: "array<{ sku, axes: Record<variantAxisId, string>, availability, price }>"
    onMissingGeoField: fail-build    # Fase 7 concluida (docs/adr/0021): produto sem campo GEO derruba o build; loja sem avaliacoes ainda pode rebaixar para warn-build no proprio config

  collection:
    required: [id, name, slug, breadcrumb, productCount]
    requiredForGeo: [intro, faq, relatedLinks]

  organization:
    required: [name, legalName, url, logo, address, sameAs]
    optional: [foundingDate, taxId, contactPoint]

  # Cliente, pedido e loja fisica (Fase 9, ADR 0027/0028). Nunca indexavel nem GEO:
  # sao dados pessoais ou operacionais, nao conteudo de catalogo. Fixtures mock
  # entram no data layer nas sub-fases 9c (customer/order) e 9d (store).
  customer:
    required: [id, name, email]
    optional: [cpf, phone, birthDate]
    addresses:
      required: [id, label, recipient, street, number, neighborhood, city, state, postalCode]
      optional: [complement, isDefault]

  order:
    required: [id, placedAt, status, items, subtotal, total]
    items:
      required: [sku, name, quantity, unitPrice]
    # inTransit/delivered tambem cobrem retirada em loja (Fase 9d): o status nao
    # distingue o canal, so o progresso do pedido.
    status: [placed, processing, inTransit, delivered, canceled]

  # Favoritos/wishlist (Fase 9c, ADR 0027). So referencia um sku do catalogo (o
  # nome/preco/imagem vem sempre do produto atual via data.product, nunca
  # duplicado aqui) - diferente de order.items, que e um snapshot congelado no
  # momento da compra.
  favorite:
    required: [sku, addedAt]

  store:
    required: [id, name, cnpj, address, geoCoordinates, pickupEnabled, deliveryRadiusKm]
    optional: [openingHours]
    note: >
      Lista real de lojas de uma loja Nears especifica e dado de runtime (como
      navigation), nunca hardcoded aqui ou em nears.config.yaml (ADR 0028). Este
      contrato so valida a forma de cada loja que o data layer expoe.

  storeInventory:
    required: [storeId, sku, quantity, reservable]
    note: >
      Estoque granular por loja (nao um pool unico) - necessario para
      ship-from-store/retirada; ver ADR 0028 "fulfillment por loja". Nao e o MOI
      (Multilevel Omnichannel Inventory) real da VTEX, que resolve um problema
      diferente (marketplace multi-seller de 3 niveis) - a correcao desse
      engano esta documentada na ADR 0028. So existe quando
      fulfillment.inventory.mode = "per-store"; com "shared" (default), o estoque
      continua vindo de data.product.offers.availability, sem granularidade por
      loja.

seo:
  global:
    canonical: self-referencing
    titleTemplate: "{page} | {brand}"
    descriptionMaxChars: 158
    openGraph:
      required: [og:title, og:description, og:url, og:type, og:image]
      imageSize: "1200x630"
    twitter: { card: summary_large_image }
    robotsDefault: "index,follow,max-image-preview:large"
    headings: { h1PerPage: 1, skipLevels: forbidden }
    altText:
      strategy: rule-based
      pattern: "{name} {variantValues} {brand}"   # variantValues segue catalog.variantAxes; termos repetidos sao removidos
    noJsRender: required

  byTemplate:
    home:
      h1: descriptive
      schema: [WebSite, SearchAction, Organization]
    collection:
      h1: collectionName
      schema: [BreadcrumbList, ItemList, CollectionPage, FAQPage]
    longtail:
      h1: keyword
      schema: [BreadcrumbList, ItemList, CollectionPage, FAQPage]
      requires: [uniqueIntro, faq]
    pdp:
      h1: productName
      schema: [BreadcrumbList, Product, Offer, AggregateRating]
    landing:
      h1: campaignTitle
      schema: [BreadcrumbList]
    page:
      h1: pageTitle
      schema: [WebPage, FAQPage]
    sitemap:
      h1: "Mapa do site"
      schema: [WebPage]
    search:
      robots: "noindex,nofollow"
      schema: []
    notfound:
      robots: "noindex,nofollow"
      schema: []
    # Login/cadastro (Fase 9b, ADR 0027): sempre noindex,nofollow - formulario
    # de dado pessoal, nunca conteudo de catalogo a citar/indexar.
    login:
      robots: "noindex,nofollow"
      schema: []
    cadastro:
      robots: "noindex,nofollow"
      schema: []
    # Area da conta (Fase 9c, ADR 0027): sempre noindex,nofollow - dado pessoal,
    # nunca conteudo de catalogo a citar/indexar (mesmo raciocinio de login/cadastro).
    account:
      robots: "noindex,nofollow"
      schema: []
    account-dados:
      robots: "noindex,nofollow"
      schema: []
    account-enderecos:
      robots: "noindex,nofollow"
      schema: []
    account-pedidos:
      robots: "noindex,nofollow"
      schema: []
    account-pedido-detalhe:
      robots: "noindex,nofollow"
      schema: []
    account-favoritos:
      robots: "noindex,nofollow"
      schema: []
    # Fulfillment por loja (Fase 9d, ADR 0028): pagina publica, indexavel -
    # reforca geo.entity.napConsistency com um LocalBusiness por loja.
    lojas:
      h1: "Nossas lojas"
      schema: [WebPage, LocalBusiness]

geo:
  requiredEverywhere:
    answerFirstParagraph: true
    headingsAsQuestions: true
    selfContainedChunks: true
    noContentBehindInteraction: true
    tablesAsHtml: true
    factualWithNumbersAndDates: true
  entity:
    organization: [name, foundingDate, address, sameAs, logo]
    napConsistency: enforced
  coverage:
    faqOnCollections: 0.8      # minimo 80% das collections
    faqOnPdp: 1.0
    productSchemaCompleteness: 1.0
  files:
    robotsTxt: generated
    llmsTxt: generated
  agents:
    # Decisao registrada em docs/adr/0016-politica-de-agentes-e-multitenancy.md.
    # Padrao do template: permitir crawlers que citam a loja em respostas de IA
    # e bloquear o que so alimenta corpus de treino sem retorno. Cada loja pode
    # sobrescrever no proprio nears.config.yaml.
    GPTBot: allow
    OAI-SearchBot: allow
    PerplexityBot: allow
    ClaudeBot: allow
    Google-Extended: allow
    CCBot: disallow
  attribution:
    trackAiReferrals: true
    referrerPatterns:
      - "chat.openai.com"
      - "chatgpt.com"
      - "perplexity.ai"
      - "claude.ai"
      - "gemini.google.com"
      - "copilot.microsoft.com"

gates:
  performance:
    lighthouseMobile: { performance: 0.90, accessibility: 0.95, seo: 1.0 }
    cruxP75: { lcp: 2000, inp: 200, cls: 0.05 }
    budgets: enforced-in-ci
  accessibility:
    wcag: "2.2-AA"
    keyboardPath: complete
    axeViolations: 0
    # Lido por pnpm tokens:contrast. Cada par e checado nos dois temas
    # (light e dark); falha o build se qualquer um ficar abaixo do minimo.
    # text = 4.5 (WCAG 1.4.3); ui = 3.0 (WCAG 1.4.11, limites e foco).
    contrastPairs:
      - { fg: on-surface,       bg: [surface, surface-subtle, surface-raised], min: text }
      - { fg: on-surface-muted, bg: [surface, surface-subtle, surface-raised], min: text }
      - { fg: on-surface-faint, bg: [surface, surface-subtle, surface-raised], min: text }
      - { fg: link,             bg: [surface, surface-subtle, surface-raised], min: text }
      - { fg: price,            bg: [surface, surface-subtle, surface-raised], min: text }
      - { fg: price-sale,       bg: [surface, surface-subtle, surface-raised], min: text }
      - { fg: price-list,       bg: [surface, surface-subtle, surface-raised], min: text }
      - { fg: on-inverse,       bg: [surface-inverse], min: text }
      - { fg: action-on,        bg: [action, action-hover], min: text }
      - { fg: badge-promo-on,   bg: [badge-promo-bg], min: text }
      - { fg: success,         bg: [surface, surface-subtle, surface-raised], min: text }
      - { fg: warning,         bg: [surface, surface-subtle, surface-raised], min: text }
      - { fg: danger,          bg: [surface, surface-subtle, surface-raised], min: text }
      - { fg: info,            bg: [surface, surface-subtle, surface-raised], min: text }
      - { fg: border-control,   bg: [surface, surface-subtle, surface-raised], min: ui }
      - { fg: focus-ring,       bg: [surface, surface-subtle, surface-raised], min: ui }
    # Tokens decorativos (border, border-strong) ficam fora de proposito:
    # WCAG nao exige contraste de elementos que nao identificam um controle.
    contrastMin: { text: 4.5, ui: 3.0 }
  security:
    # Espelha nears.config.yaml > security. Enforcement exato por linha em
    # docs/adr/0008-seguranca-de-cadeia-de-suprimentos-e-ci.md.
    headers: enforced-in-ci
    dependencyAudit: enforced-in-ci
    secretScanning: enforced-in-ci
    staticAnalysis: enforced-in-ci       # CodeQL via default setup do GitHub (ADR 0008)
    multiTenancyHostValidation: pending-fase-6
  seo:
    richResultsErrors: 0
    templatesChecked: [product, breadcrumb, itemlist, faq]
    noJsIndexableContent: required
    orphanPages: 0
  geo:
    faqCoverage: 0.8
    productSchemaCompleteness: 1.0
    llmsTxt: present
  governance:
    everySectionDeclares: [priority, cwv, a11y]
    noHardcodedBrandValues: true
    storybookCoverage: 1.0
