# Mapa de URLs. O roteador do app e gerado a partir deste arquivo.
#
# `appRoute`: caminho real do arquivo no App Router (sem extensao), fonte
# unica da verdade para o roteador E para scripts/check-budgets.mjs - nenhum
# dos dois adivinha nome de pasta a partir do `pattern`. Varias rotas
# compartilham o mesmo appRoute de proposito: elas sao formas diferentes do
# MESMO arquivo fisico, que resolve a fonte certa em runtime pelo indice de
# slugs (ver bloco `resolution` abaixo e docs/adr/0003). Isso e' inevitavel no
# App Router: nao existe "/[department]/page" e "/[productType]/page" como
# irmaos no mesmo nivel, so' um nome de parametro por posicao de segmento.
#
# `jsBudgetCritical`: true marca rotas de descoberta/compra cobertas pelo
# limite de 120KB gzip (CLAUDE.md > Performance). Paginas institucionais,
# busca (CSR) e o hub de sitemap ficam de fora: nao sao caminho de conversao.
version: 1.0.0

defaults:
  render: isr
  revalidate: 300
  indexable: true
  headerVariant: full

routes:
  - id: home
    pattern: "/"
    template: home
    render: ssg
    priority: 1.0
    appRoute: "/page"
    jsBudgetCritical: true

  - id: department
    pattern: "/{department}"
    template: collection
    source: cms
    priority: 0.9
    appRoute: "/[slug]/page"     # grupo ambiguo de 1o segmento - ver nota do topo
    jsBudgetCritical: true
    params:
      department:
        type: enum
        from: navigation.departments

  - id: department-category
    pattern: "/{department}/{category}"
    template: collection
    source: cms
    priority: 0.8
    appRoute: "/[slug]/[sub]/page"   # grupo ambiguo de 2o segmento
    jsBudgetCritical: true

  - id: department-category-sub
    pattern: "/{department}/{category}/{subcategory}"
    template: collection
    source: cms
    priority: 0.7
    appRoute: "/[slug]/[sub]/[subsub]/page"
    jsBudgetCritical: true

  - id: category-flat
    pattern: "/{productType}"
    template: collection
    source: catalog
    priority: 0.7
    appRoute: "/[slug]/page"     # mesmo grupo ambiguo de department
    jsBudgetCritical: true
    enabledBy: catalog.flatAxis.enabled
    note: >
      Eixo plano por tipo de produto, paralelo ao eixo de departamento
      (ex.: todos os itens de um tipo, independente do departamento).
      Indexavel apenas neste nivel.

  - id: category-flat-attribute
    pattern: "/{productType}/{attributeValue}"
    template: collection
    source: catalog
    indexable: false
    canonicalTo: department-category
    appRoute: "/[slug]/[sub]/page"   # mesmo grupo ambiguo de department-category
    jsBudgetCritical: true
    enabledBy: catalog.flatAxis.secondLevelAttribute
    note: >
      Nivel 2 do eixo plano, filtrado pelo atributo definido em
      catalog.flatAxis.secondLevelAttribute. Duplica o eixo de departamento:
      rastreavel mas nao indexavel.

  - id: longtail
    pattern: "/b/{keyword}"
    template: collection
    source: query-preset
    priority: 0.6
    scale: high
    appRoute: "/b/[keyword]/page"   # prefixo literal "b" - nao ambiguo
    jsBudgetCritical: true
    requires:
      - uniqueH1
      - uniqueIntro
      - faq
      - relatedLinks
    note: >
      Landings de cauda longa com filtros pre-aplicados.
      Sem conteudo unico a pagina nao e publicada.

  - id: campaign
    pattern: "/{campaign}"
    template: landing
    priority: 0.5
    indexable: conditional
    appRoute: "/[slug]/page"     # mesmo grupo ambiguo de department
    jsBudgetCritical: true
    schedule:
      startField: startsAt
      endField: endsAt
      onExpire: redirect

  - id: campaign-segment
    pattern: "/{campaign}/{segment}"
    template: landing
    indexable: conditional
    appRoute: "/[slug]/[sub]/page"   # mesmo grupo ambiguo de department-category
    jsBudgetCritical: true

  - id: pdp
    pattern: "/{productSlug}/p"
    template: pdp
    priority: 0.8
    headerVariant: full   # minimal exigiria grupos de rota no layout raiz; decisao em docs/adr/0025
    appRoute: "/[slug]/p/page"   # sufixo literal "/p" vence /[slug]/[sub]; o Next exige o mesmo nome de parametro ([slug]) no 1o segmento - docs/adr/0009
    jsBudgetCritical: true

  - id: search
    pattern: "/s"
    template: search
    render: csr
    indexable: false
    robots: "noindex,nofollow"
    appRoute: "/s/page"
    jsBudgetCritical: false   # CSR, sem conteudo indexavel: fora do budget de rota critica

  - id: institutional
    pattern: "/{pageSlug}"
    template: page
    render: ssg
    priority: 0.4
    appRoute: "/[slug]/page"   # mesmo grupo ambiguo de department; bundle ja' coberto por ele
    jsBudgetCritical: false

  - id: sitemap-html
    pattern: "/mapa-do-site"
    template: sitemap
    render: ssg
    required: true
    priority: 0.5
    appRoute: "/mapa-do-site/page"
    jsBudgetCritical: false   # hub de links, nao rota de conversao
    note: "Hub de linkagem interna. Obrigatorio no template padrao."

  - id: not-found
    pattern: "/404"
    template: notfound
    indexable: false
    robots: "noindex,nofollow"
    appRoute: ~   # app/not-found.tsx - arquivo especial do Next, fora do mapa de paginas
    jsBudgetCritical: false

  # Login/cadastro mock (Fase 9b, ADR 0027). ssg: o HTML (formulario vazio) e
  # igual para qualquer visitante - nenhuma leitura de cookie de sessao aqui
  # (isso so entra nas rotas de /account/** da Fase 9c, com render: ssr).
  # jsBudgetCritical: false pelo mesmo motivo de institutional/sitemap-html:
  # nao e caminho de conversao/descoberta de produto.
  - id: login
    pattern: "/login"
    template: login
    render: ssr   # shell estatico + ilha com Suspense (returnUrl/erro vem da query - ver app/login/page.tsx)
    indexable: false
    robots: "noindex,nofollow"
    appRoute: "/login/page"
    jsBudgetCritical: false

  - id: cadastro
    pattern: "/cadastro"
    template: cadastro
    render: ssr   # mesmo padrao do login
    indexable: false
    robots: "noindex,nofollow"
    appRoute: "/cadastro/page"
    jsBudgetCritical: false

# Area da conta (Fase 9c, ADR 0027). Mesmo padrao de login/cadastro (9b): leem
# cookie de sessao a cada requisicao, nunca servem o HTML de um cliente para
# outro - render: ssr, nunca isr/ssg. requiresAuth: true aciona o guard
# server-side (apps/web/lib/auth/guard.ts > requireCustomer) que redireciona
# para /login?returnUrl=... quando a sessao falta. Nunca indexavel (dado
# pessoal, nunca conteudo de catalogo). jsBudgetCritical: false pelo mesmo
# motivo de login/cadastro: nao e caminho de conversao/descoberta de produto.
  - id: account
    pattern: "/account"
    template: account
    render: ssr
    requiresAuth: true
    indexable: false
    robots: "noindex,nofollow"
    appRoute: "/account/page"
    jsBudgetCritical: false

  - id: account-dados
    pattern: "/account/dados"
    template: account-dados
    render: ssr
    requiresAuth: true
    indexable: false
    robots: "noindex,nofollow"
    appRoute: "/account/dados/page"
    jsBudgetCritical: false

  - id: account-enderecos
    pattern: "/account/enderecos"
    template: account-enderecos
    render: ssr
    requiresAuth: true
    indexable: false
    robots: "noindex,nofollow"
    appRoute: "/account/enderecos/page"
    jsBudgetCritical: false

  - id: account-pedidos
    pattern: "/account/pedidos"
    template: account-pedidos
    render: ssr
    requiresAuth: true
    indexable: false
    robots: "noindex,nofollow"
    appRoute: "/account/pedidos/page"
    jsBudgetCritical: false

  - id: account-pedido-detalhe
    pattern: "/account/pedidos/{orderId}"
    template: account-pedido-detalhe
    render: ssr
    requiresAuth: true
    indexable: false
    robots: "noindex,nofollow"
    appRoute: "/account/pedidos/[orderId]/page"   # 3o segmento: refs.ts nao valida (so 1o/2o) - ver nota de resolution abaixo
    jsBudgetCritical: false

  - id: account-favoritos
    pattern: "/account/favoritos"
    template: account-favoritos
    render: ssr
    requiresAuth: true
    indexable: false
    robots: "noindex,nofollow"
    appRoute: "/account/favoritos/page"
    jsBudgetCritical: false

# Fulfillment por loja (Fase 9d, ADR 0028). Pagina institucional publica (NAO
# dado pessoal): reforca geo.entity.napConsistency e serve como pagina-fonte
# dos LocalBusiness de cada loja fisica. Fixture estatico (stores.ts), sem
# leitura de cookie/sessao - render: ssg, igual a institutional/sitemap-html.
# jsBudgetCritical: false pelo mesmo motivo: nao e caminho de descoberta de
# produto. Linkada pelo footer institucional (storefront.ts) - zero paginas
# orfas.
  - id: lojas
    pattern: "/lojas"
    template: lojas
    render: ssg
    priority: 0.5
    appRoute: "/lojas/page"
    jsBudgetCritical: false

# Carrinho de pagina propria (Fase 10, ADR 0029). Mesmo padrao de
# /account/**: le o cookie `nears_cart` a cada requisicao, nunca serve o
# carrinho de um visitante para outro - render: ssr, nunca isr/ssg. Nunca
# indexavel (dado por visitante, nunca conteudo de catalogo, mesmo motivo de
# login/account). jsBudgetCritical: false pelo mesmo motivo de
# login/account: nao e caminho de descoberta de produto. `carrinho` ja
# estava reservado desde a Fase 9a.
  - id: carrinho
    pattern: "/carrinho"
    template: carrinho
    render: ssr
    indexable: false
    robots: "noindex,nofollow"
    appRoute: "/carrinho/page"
    jsBudgetCritical: false

# Stub de checkout (Fase 10, ADR 0029): so avisa que o checkout de verdade e
# responsabilidade do backend/painel (CLAUDE.md > Seguranca) - nao processa
# nem simula pagamento, nenhum dado dinamico lido (render: ssg, igual a
# institutional/lojas). `checkout` ja estava reservado desde a Fase 9a.
  - id: checkout
    pattern: "/checkout"
    template: checkout
    render: ssg
    indexable: false
    robots: "noindex,nofollow"
    appRoute: "/checkout/page"
    jsBudgetCritical: false

# Varios padroes tem a mesma forma de URL: /{department}, /{productType},
# /{campaign} e /{pageSlug} (um segmento); /{department}/{category},
# /{productType}/{attributeValue} e /{campaign}/{segment} (dois segmentos).
# O roteador NAO tenta um apos o outro (cada tentativa seria um fetch somando
# TTFB): consulta um indice de slugs que diz a qual fonte cada slug pertence.
# Decisao registrada em docs/adr/0003-resolucao-de-rotas-e-robots.md.
resolution:
  strategy: slug-index
  literalSegmentsFirst: true     # /s, /b/..., /mapa-do-site, /404 e /{x}/p vencem
                                 # qualquer padrao feito so de parametros
  slugIndex:
    scope: first-segment         # um slug de 1o segmento pertence a UMA fonte
    sources:
      - { route: department, from: cms }
      - { route: category-flat, from: catalog }
      - { route: campaign, from: cms }
      - { route: institutional, from: cms }
    onConflict: fail-build       # CMS/catalogo nao publicam slug ja usado por outra fonte
    onMiss: not-found            # slug fora do indice -> status 404 real, nunca soft 404
    revalidate: 300
  secondSegment:
    # Resolvido o 1o segmento, o 2o so e procurado na fonte correspondente.
    department: department-category
    category-flat: category-flat-attribute
    campaign: campaign-segment
  reserved:
    firstSegment:                # nenhuma fonte pode usar estes slugs
      - s
      - b
      - p
      - mapa-do-site
      - sitemap                  # /sitemap/{segmento}-{n}.xml (Fase 7)
      - "404"
      - api
      - account
      - carrinho
      - checkout
      - login
      - cadastro                  # Fase 9, ADR 0027 - nao estava reservado antes da rota existir
      - lojas                     # Fase 9d, ADR 0028 - nao estava reservado antes da rota existir
      - preview
      - quick-view
      - design-system
      - test
      - teste
      - qa
    secondSegment: [p, dados, enderecos, pedidos, favoritos]   # /{x}/p e sempre PDP; os demais sao sub-rotas literais de /account (Fase 9c)

canonical:
  strategy: self-referencing
  rules:
    - when: "route.id == 'category-flat-attribute'"
      canonicalTo: department-category
      reason: "Eixo de departamento e o canonico para nivel 2+"
    - when: "query has utm_* or gclid or fbclid"
      stripParams: true
    - when: "route.template == 'collection' and facets.length > 1"
      robots: "noindex,follow"

facets:
  indexableFrom: catalog.facets.indexable   # definido por nicho em nears.config.yaml
  indexableAlone: true          # so indexa quando aplicada isoladamente
  neverIndexable: [price, sort, page_size, seller]
  pagination:
    strategy: indexable-urls
    param: page
    firstPageCanonical: self

excluded:
  # robots.txt casa por PREFIXO: "Disallow: /s" bloquearia /saias, /sofas,
  # /smartphones; "/carrinho*" bloquearia /carrinho-de-bebe. Por isso aqui so
  # entram NOMES de segmento, e o gerador (Fase 7) emite tres linhas exatas
  # por segmento:  Disallow: /{seg}$   Disallow: /{seg}/   Disallow: /{seg}?
  # Nunca escreva "*" nesta lista.
  disallowSegments: [account, carrinho, checkout, login, cadastro, s]
  # Prefixos que ja terminam em "/" sao seguros como prefixo.
  disallowPrefixes: ["/quick-view/", "/preview/", "/api/"]

forbiddenInProduction:
  # Mesma semantica de segmento: bloqueia /qa e /qa/..., nao /quadros nem
  # /testes-de-gravidez.
  segments: [design-system, test, teste, qa]
  note: >
    O build de producao falha se alguma destas rotas resolver.
    Ambiente interno nunca vive na raiz do dominio publico.

sitemapXml:
  enabled: true
  segmented: true
  maxUrlsPerFile: 1000
  segments: [product, category, longtail, campaign, page, brand]
